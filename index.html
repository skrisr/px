<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pseudo Browser</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: sans-serif; display: flex; flex-direction: column; height: 100vh; background: #202124; }
        #toolbar { display: flex; gap: 8px; padding: 8px; background: #3c4043; align-items: center; }
        #address-bar { flex: 1; padding: 8px 12px; border: none; border-radius: 20px; background: #202124; color: white; font-size: 14px; outline: none; }
        #go-btn { padding: 8px 16px; border: none; border-radius: 20px; background: #1a73e8; color: white; cursor: pointer; font-weight: bold; }
        #go-btn:hover { background: #1557b0; }
        #viewport-container { flex: 1; background: white; overflow: auto; position: relative; }
        #viewport { width: 100%; height: 100%; border: none; padding: 20px; }
        .loading { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); font-size: 18px; color: #5f6368; display: none; }
    </style>
</head>
<body>

    <div id="toolbar">
        <input type="text" id="address-bar" value="https://example.com" placeholder="URLを入力 (例: https://example.com)">
        <button id="go-btn">移動</button>
    </div>

    <div id="viewport-container">
        <div id="loading" class="loading">読み込み中...</div>
        <div id="viewport"></div>
    </div>

    <script>
        const addressBar = document.getElementById('address-bar');
        const goBtn = document.getElementById('go-btn');
        const viewport = document.getElementById('viewport');
        const loading = document.getElementById('loading');

        async function loadPage(url) {
            if (!url.startsWith('http://') && !url.startsWith('https://')) {
                url = 'https://' + url;
                addressBar.value = url;
            }

            loading.style.display = 'block';
            viewport.innerHTML = '';

            try {
                const proxyUrl = `https://corsproxy.io{encodeURIComponent(url)}`;
                const response = await fetch(proxyUrl);
                
                if (!response.ok) throw new Error('Proxy server error');
                
                let html = await response.text();

                if (!html) {
                    viewport.innerHTML = '<p style="color:red;">HTMLを取得できませんでした。</p>';
                    return;
                }

                const baseUrl = new URL(url);
                
                html = html.replace(/(src|href)\s*=\s*(['"])(?!https?:\/\/|\/\/)([^'"]+)\2/gi, (match, attr, q, path) => {
                    try {
                        const absoluteUrl = new URL(path, baseUrl.href).href;
                        return `${attr}=${q}${absoluteUrl}${q}`;
                    } catch (e) {
                        return match;
                    }
                });

                viewport.innerHTML = html;

                viewport.querySelectorAll('a').forEach(anchor => {
                    anchor.addEventListener('click', (e) => {
                        e.preventDefault();
                        const href = anchor.getAttribute('href');
                        if (href) {
                            addressBar.value = href;
                            loadPage(href);
                        }
                    });
                });

            } catch (error) {
                viewport.innerHTML = `<p style="color:red;">エラーが発生しました: ${error.message}</p>`;
            } finally {
                loading.style.display = 'none';
            }
        }

        goBtn.addEventListener('click', () => loadPage(addressBar.value));
        addressBar.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') loadPage(addressBar.value);
        });

        loadPage(addressBar.value);
    </script>
</body>
</html>
